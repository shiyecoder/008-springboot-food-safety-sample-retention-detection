<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>留样与校验规则 · 食品安全留样与检测管理系统</title>
<link rel="stylesheet" href="assets/app.css">
<script src="assets/shell.js" defer></script>
<style>
  .wrow{display:grid;grid-template-columns:130px 1fr 90px 90px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #F0E7E3}
  .wrow:last-of-type{border-bottom:0}
  .wrow .inp{width:72px;min-width:0;text-align:right}
  .total{display:flex;align-items:center;gap:10px;background:#FBF6F7;border:1px solid #F0E2E5;border-radius:6px;padding:10px 14px;font-size:12.5px;margin-top:12px}
  .total b{font-size:18px;color:var(--c-brand);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="shell" data-shell="主管" data-active="/rule">
  <template data-body>
    <div class="page-h">
      <div><h1>留样与校验规则</h1><p>当前生效版本 v3（2026-09-01 生效）· 修改后需重新计算才影响历史数据</p></div>
      <div class="acts">
        <button class="btn btn-ghost">恢复默认</button>
        <button class="btn btn-primary">保存并发布新版本</button>
      </div>
    </div>

    <div class="grid3" style="grid-template-columns:1.25fr 1fr">
      <!-- 校验权重 -->
      <div class="card">
        <div class="card-h"><h3>留样覆盖率与到期处置校验 · 权重配置</h3><span class="more">6 个因素</span></div>
        <p class="muted" style="font-size:12px;margin-bottom:12px">权重合计必须等于 100%，保存后生成新版本号并记录生效时间；已产生的计算结果按当时的规则版本留痕，不随权重变化重算。</p>

        <div class="wrow" style="font-size:11.5px;color:var(--c-text-3);border-bottom:1px solid var(--c-line)">
          <span>影响因素</span><span>数据来源</span><span style="text-align:right">权重 %</span><span style="text-align:right">缺失处理</span>
        </div>
        <div class="wrow"><span>菜单批次</span><span class="muted" style="font-size:12px">food_batch.menu_code</span><input class="inp" value="15"><span class="tag plain" style="justify-self:end">不参与</span></div>
        <div class="wrow"><span>应留样数量</span><span class="muted" style="font-size:12px">sample_rule.should_count</span><input class="inp" value="20"><span class="tag plain" style="justify-self:end">提示补录</span></div>
        <div class="wrow"><span>实际重量</span><span class="muted" style="font-size:12px">food_sample.weight</span><input class="inp" value="20"><span class="tag plain" style="justify-self:end">不参与</span></div>
        <div class="wrow"><span>入柜时间</span><span class="muted" style="font-size:12px">food_sample.store_time</span><input class="inp" value="15"><span class="tag plain" style="justify-self:end">不参与</span></div>
        <div class="wrow"><span>保留时长</span><span class="muted" style="font-size:12px">food_sample.expire_time</span><input class="inp" value="15"><span class="tag plain" style="justify-self:end">不参与</span></div>
        <div class="wrow"><span>处置凭证完整性</span><span class="muted" style="font-size:12px">disposal_record.photo</span><input class="inp" value="15"><span class="tag plain" style="justify-self:end">不参与</span></div>

        <div class="total">
          <span class="muted">权重合计</span><b>100</b><span class="muted">%</span>
          <span class="tag ok" style="margin-left:6px">校验通过</span>
          <span class="muted" style="margin-left:auto;font-size:11.5px">等级阈值：优 ≥ 85　良 70–84　中 55–69　差 &lt; 55</span>
        </div>

        <div class="form-row" style="margin-top:16px">
          <label style="width:90px;flex:0 0 90px">生效时间</label>
          <div class="ctrl"><input class="inp" value="2026-11-01 00:00:00" style="width:240px"></div>
        </div>
        <div class="form-row">
          <label style="width:90px;flex:0 0 90px">变更说明</label>
          <div class="ctrl"><input class="inp" style="width:100%;max-width:420px" value="提高处置凭证权重，强化销毁留痕要求"></div>
        </div>
      </div>

      <!-- 留样标准 -->
      <div class="card">
        <div class="card-h"><h3>留样标准（按分类）</h3><span class="more">新增分类</span></div>
        <table class="tbl" style="margin-top:-4px">
          <thead><tr><th>分类</th><th class="r">最低重量</th><th>存储条件</th><th class="r">保留时长</th><th>状态</th></tr></thead>
          <tbody>
            <tr><td>热菜</td><td class="r mono-num">125 g</td><td class="muted">0–4 ℃</td><td class="r mono-num">48 h</td><td><span class="tag ok">启用</span></td></tr>
            <tr><td>凉菜</td><td class="r mono-num">125 g</td><td class="muted">0–4 ℃</td><td class="r mono-num">48 h</td><td><span class="tag ok">启用</span></td></tr>
            <tr><td>面点</td><td class="r mono-num">100 g</td><td class="muted">0–4 ℃</td><td class="r mono-num">48 h</td><td><span class="tag ok">启用</span></td></tr>
            <tr><td>汤品</td><td class="r mono-num">250 g</td><td class="muted">0–4 ℃</td><td class="r mono-num">48 h</td><td><span class="tag ok">启用</span></td></tr>
            <tr><td>自制饮品</td><td class="r mono-num">200 g</td><td class="muted">0–4 ℃</td><td class="r mono-num">24 h</td><td><span class="tag plain">停用</span></td></tr>
          </tbody>
        </table>
        <div class="note" style="margin-top:12px">任务生成时读取当时生效的规则快照，之后修改规则不影响已生成任务的标准值。</div>

        <div class="card-h" style="margin-top:18px"><h3>版本历史</h3></div>
        <div class="tl">
          <div class="it"><div class="t">v3 · 当前生效</div><div class="m">2026-09-01 生效 · 王建国</div><div class="c">凭证权重 10% → 15%，新增「入柜时间」因素</div></div>
          <div class="it todo"><div class="t">v2</div><div class="m">2026-06-15 至 2026-08-31</div><div class="c">首次引入到期处置校验，5 个因素</div></div>
          <div class="it todo"><div class="t">v1</div><div class="m">2026-03-01 至 2026-06-14</div><div class="c">仅按重量与仓位做基础校验</div></div>
        </div>
      </div>
    </div>
  </template>
</div>
</body>
</html>
